version: "3.8"

services:
  app:
    image: node:25
    init: true
    command: sleep infinity
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - h2bc-web-dev

  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - h2bc-web-dev

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - h2bc-web-dev

volumes:
  db-data:
  redis-data:

networks:
  h2bc-web-dev:
    external: true
